=<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" data-view="consolidado" data-sidebar="closed">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backoffice Vero B2C · Junho 2026 · Mídia Simples</title>
<meta name="theme-color" content="#0B0D10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root {
  --font-serif: 'Fraunces', Georgia, serif;
  --font-sans: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --green: #22C55E;
  --red: #EF4444;
  --sidebar-w: 240px;
}

[data-theme="dark"] {
  --bg: #0B0D10;
  --bg-card: #131619;
  --bg-card-2: #181B1F;
  --bg-sidebar: #131619;
  --bg-row-hover: #1B1F24;
  --border: #1F2328;
  --border-strong: #2A2F36;
  --text: #E6E8EB;
  --text-muted: #8B9099;
  --text-dim: #5C6470;
}

[data-theme="light"] {
  --bg: #FAFAF9;
  --bg-card: #FFFFFF;
  --bg-card-2: #F5F5F4;
  --bg-sidebar: #FFFFFF;
  --bg-row-hover: #F0EFEE;
  --border: #E7E5E4;
  --border-strong: #D6D3D1;
  --text: #0C0A09;
  --text-muted: #57534E;
  --text-dim: #A8A29E;
}

/* Paleta — azul Backoffice + cor por funcionária */
[data-view="consolidado"] { --accent: #0EA5E9; --accent-2: #0284C7; --accent-soft: rgba(14,165,233,0.14); }
[data-view="sophia"]      { --accent: #8B5CF6; --accent-2: #7C3AED; --accent-soft: rgba(139,92,246,0.14); }
[data-view="rayssa"]      { --accent: #EC4899; --accent-2: #DB2777; --accent-soft: rgba(236,72,153,0.14); }
[data-view="leticia"]     { --accent: #10B981; --accent-2: #059669; --accent-soft: rgba(16,185,129,0.14); }

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  background: var(--bg); color: var(--text);
  font-family: var(--font-sans); font-size: 14px;
  transition: background 0.2s, color 0.2s;
}
body { min-height: 100vh; padding-bottom: 80px; }

/* === SIDEBAR === */
.sidebar {
  position: fixed; top: 0; left: 0; bottom: 0;
  width: var(--sidebar-w);
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  z-index: 200;
  display: flex; flex-direction: column;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
html[data-sidebar="closed"] .sidebar { transform: translateX(-100%); }

.sidebar-head {
  padding: 18px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  min-height: 75px;
}
.sidebar-logo-box {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, #0EA5E9, #0284C7);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-serif); font-size: 18px; font-weight: 600;
  color: #fff;
  cursor: pointer;
  flex-shrink: 0;
}
.sidebar-logo-text {
  display: flex; flex-direction: column; gap: 2px;
}
.sidebar-logo-text .title {
  font-family: var(--font-sans); font-size: 13px; font-weight: 600;
  color: var(--text);
}
.sidebar-logo-text .sub {
  font-family: var(--font-mono); font-size: 9px; font-weight: 500;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--text-dim);
}

.sidebar-list {
  padding: 14px 10px; flex: 1; overflow-y: auto;
}
.sidebar-list::-webkit-scrollbar { width: 4px; }
.sidebar-list::-webkit-scrollbar-thumb { background: var(--border-strong); }

.sidebar-section-label {
  font-family: var(--font-mono);
  font-size: 9px; font-weight: 500;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--text-dim);
  padding: 6px 12px 8px;
}

.sidebar-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  cursor: pointer;
  margin-bottom: 3px;
  border-left: 2px solid transparent;
  transition: background 0.1s, border-color 0.1s;
}
.sidebar-item:hover { background: var(--bg-card-2); }
.sidebar-item.active {
  background: var(--bg-card-2);
  border-left-color: var(--brand-color);
}

.sidebar-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  background: var(--brand-color);
  color: #fff;
  font-family: var(--font-sans); font-size: 12px; font-weight: 600;
}

.sidebar-item .name {
  font-size: 13px; color: var(--text); font-weight: 500;
  flex: 1;
}

/* === BOTÃO TOGGLE === */
.sidebar-toggle-btn {
  position: fixed; top: 24px; left: 0;
  width: 32px; height: 56px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-left: none;
  color: var(--text-muted);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  border-radius: 0 10px 10px 0;
  font-size: 15px;
  z-index: 199;
  transition: all 0.2s, left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 2px 0 12px rgba(0,0,0,0.15);
}
.sidebar-toggle-btn:hover {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  width: 36px;
}
html[data-sidebar="open"] .sidebar-toggle-btn {
  left: var(--sidebar-w);
}

/* === MAIN === */
.main-area {
  margin-left: 0;
  transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  min-height: 100vh;
}
html[data-sidebar="open"] .main-area { margin-left: var(--sidebar-w); }

.topbar {
  position: sticky; top: 0; z-index: 50;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 18px 32px 18px 64px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 24px;
  transition: padding-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
html[data-sidebar="open"] .topbar { padding-left: 32px; }

.brand-wrap {
  display: flex; align-items: center; gap: 18px;
  flex-shrink: 0;
  cursor: pointer;
}
.brand-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-serif); font-size: 16px; font-weight: 600;
  color: #fff;
}
.brand-text { display: flex; flex-direction: column; gap: 2px; }
.brand-text .title { font-family: var(--font-sans); font-size: 14px; font-weight: 600; }
.brand-text .sub {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 1.2px;
  text-transform: uppercase; color: var(--text-muted);
}

.brand-meta {
  display: flex; gap: 8px; align-items: center;
  padding-left: 18px; border-left: 1px solid var(--border-strong);
  color: var(--text-muted);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 1px;
}

.topbar-right { display: flex; align-items: center; gap: 18px; }
.fresh {
  display: flex; align-items: center; gap: 8px;
  color: var(--text-muted); font-size: 11px;
  font-family: var(--font-mono); letter-spacing: 0.5px;
}
.fresh-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.theme-toggle {
  background: transparent; border: 1px solid var(--border);
  color: var(--text-muted); width: 32px; height: 32px;
  cursor: pointer; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
}
.theme-toggle:hover { border-color: var(--border-strong); color: var(--text); }

.container { max-width: 1400px; margin: 0 auto; padding: 32px; }

.hero-row {
  display: grid; grid-template-columns: 1.6fr 1fr 1fr;
  gap: 20px; margin-bottom: 24px;
}
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  padding: 24px 28px;
  position: relative;
}
.card.accent { border-left: 3px solid var(--accent); }
.card.accent-2 { border-left: 3px solid var(--accent-2); }
.card-label {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  letter-spacing: 1.8px; text-transform: uppercase;
  color: var(--text-muted);
}
.card-meta {
  font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 1px;
  color: var(--text-dim);
}
.card-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 16px;
}

.hero-value {
  font-family: var(--font-serif);
  font-size: 84px; font-weight: 400;
  line-height: 1; letter-spacing: -3px;
  margin: 10px 0 12px;
}
.kpi-value {
  font-family: var(--font-serif);
  font-size: 42px; font-weight: 400;
  line-height: 1; letter-spacing: -1.5px;
  margin: 10px 0;
}
.kpi-sub { color: var(--text-muted); font-size: 12px; margin-top: 8px; }
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px;
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500; letter-spacing: 0.5px;
}
.pill.neutral { background: var(--bg-card-2); color: var(--text-muted); }
.pill.brand { background: var(--accent-soft); color: var(--accent-2); }
.pill.up { background: rgba(34,197,94,0.13); color: var(--green); }
.pill.down { background: rgba(239,68,68,0.13); color: var(--red); }

.hero-footer {
  display: flex; gap: 32px; align-items: center;
  margin-top: 18px; padding-top: 18px;
  border-top: 1px solid var(--border);
}
.hero-footer .stat-mini { display: flex; flex-direction: column; gap: 4px; }
.hero-footer .stat-mini .lbl {
  font-family: var(--font-mono);
  font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--text-dim);
}
.hero-footer .stat-mini .val {
  font-family: var(--font-serif);
  font-size: 22px; color: var(--text);
}

.section-head {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 36px 0 18px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}
.section-head h2 {
  font-family: var(--font-sans);
  font-size: 12px; font-weight: 600;
  letter-spacing: 2.5px; text-transform: uppercase;
}
.section-head .meta {
  font-family: var(--font-mono);
  font-size: 11px; color: var(--text-muted);
}

.stats-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 20px; margin-bottom: 24px;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  padding: 20px 22px;
}
.stat-card .label {
  font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--text-muted);
  margin-bottom: 14px;
}
.stat-card .value {
  font-family: var(--font-serif);
  font-size: 36px; font-weight: 400;
  line-height: 1; letter-spacing: -1px;
}
.stat-card .footer-stat {
  display: flex; gap: 6px; align-items: center;
  margin-top: 10px;
}

.chart-card { padding-bottom: 18px; }
.chart-wrap { position: relative; height: 280px; margin-top: 14px; }

/* === RANKING TABLE === */
.rank-table {
  background: var(--bg-card); border: 1px solid var(--border);
}
.rank-row {
  display: grid;
  grid-template-columns: 36px 1.5fr 0.8fr 0.8fr 1fr 0.8fr 0.8fr 40px;
  gap: 18px; align-items: center;
  padding: 18px 26px;
  border-bottom: 1px solid var(--border);
  transition: background 0.1s;
}
.rank-row.head { background: var(--bg-card-2); padding: 12px 26px; }
.rank-row.head > div {
  font-family: var(--font-mono);
  font-size: 9px; font-weight: 500;
  letter-spacing: 1.8px; text-transform: uppercase;
  color: var(--text-muted);
}
.rank-row:not(.head):hover { background: var(--bg-row-hover); cursor: pointer; }
.rank-row.total {
  background: var(--bg-card-2);
  border-top: 2px solid var(--border-strong);
  border-bottom: 0;
  cursor: default;
}

.person-cell { display: flex; align-items: center; gap: 12px; }
.person-cell .avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--brand-color);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600;
  flex-shrink: 0;
}
.person-cell .info { display: flex; flex-direction: column; gap: 2px; }
.person-cell .info .nome { font-size: 14px; font-weight: 500; color: var(--text); }
.person-cell .info .meta { font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); }

.num-val {
  font-family: var(--font-serif);
  font-size: 22px; font-weight: 400;
  color: var(--text); line-height: 1;
}
.num-val.small { font-size: 18px; }
.num-val.total-val { font-size: 28px; }
.num-val.accent-val { color: var(--accent-2); }

.row-rank { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }
.row-action { color: var(--text-dim); font-size: 14px; }
.rank-row:hover .row-action { color: var(--text); }

/* === COMPARATIVO LADO A LADO === */
.compare-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}
.compare-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-top: 3px solid var(--brand-color);
  padding: 24px;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.15s;
}
.compare-card:hover { transform: translateY(-2px); }
.compare-card .head {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 18px;
}
.compare-card .avatar-lg {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--brand-color);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-sans); font-size: 16px; font-weight: 600;
  flex-shrink: 0;
}
.compare-card .head .nome {
  font-family: var(--font-sans);
  font-size: 16px; font-weight: 600;
  color: var(--text);
}
.compare-card .head .rank-tag {
  font-family: var(--font-mono); font-size: 9px;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--text-muted);
}
.compare-card .big-num {
  font-family: var(--font-serif);
  font-size: 48px; font-weight: 400;
  line-height: 1; letter-spacing: -1.5px;
  color: var(--brand-color);
  margin-bottom: 4px;
}
.compare-card .big-lbl {
  font-family: var(--font-mono); font-size: 9px;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 18px;
}
.compare-card .row-stats {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 14px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
}
.compare-card .stat-mini { display: flex; flex-direction: column; gap: 4px; }
.compare-card .stat-mini .lbl {
  font-family: var(--font-mono); font-size: 9px;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--text-dim);
}
.compare-card .stat-mini .val {
  font-family: var(--font-serif); font-size: 20px;
  color: var(--text);
}

/* === NAV BUTTONS === */
.nav-actions {
  margin-top: 48px; padding: 28px 0;
  border-top: 1px solid var(--border);
  display: flex; gap: 16px; flex-wrap: wrap;
  align-items: center; justify-content: space-between;
}
.nav-actions .left-group { display: flex; gap: 12px; flex-wrap: wrap; }
.nav-actions .right-group { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

.nav-btn {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px 20px;
  font-family: var(--font-sans); font-size: 13px; font-weight: 500;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 12px;
  transition: border-color 0.2s, transform 0.2s;
  position: relative; overflow: hidden; z-index: 0;
}
.nav-btn::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--accent);
  transform: translateX(-101%);
  transition: transform 0.3s ease;
  z-index: -1;
}
.nav-btn:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
}
.nav-btn:hover::before { transform: translateX(0); }
.nav-btn:hover > * { color: #fff !important; }
.nav-btn:hover .nav-avatar { background: rgba(255,255,255,0.2); }

.nav-btn .arrow-l, .nav-btn .arrow-r {
  font-size: 16px; line-height: 1; font-weight: 700;
  color: var(--text-muted);
  transition: transform 0.2s, color 0.2s;
}
.nav-btn:hover .arrow-l { transform: translateX(-3px); }
.nav-btn:hover .arrow-r { transform: translateX(3px); }

.nav-btn .nav-avatar {
  width: 22px; height: 22px;
  background: var(--bg-card-2);
  color: var(--text);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600;
}

.nav-btn.primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
  border-color: var(--accent);
  font-weight: 600;
}
.nav-btn.primary::before { display: none; }
.nav-btn.primary .arrow-l, .nav-btn.primary .arrow-r { color: #fff; }

.footer {
  max-width: 1400px; margin: 60px auto 0;
  padding: 24px 32px;
  display: flex; justify-content: space-between; align-items: center;
  border-top: 1px solid var(--border);
  color: var(--text-dim); font-size: 11px;
  font-family: var(--font-mono); letter-spacing: 0.5px;
}

.empty {
  padding: 40px 20px; text-align: center;
  color: var(--text-dim); font-size: 13px;
}

.sidebar-overlay {
  display: none;
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 150;
}

@media (max-width: 1100px) {
  html[data-sidebar="open"] .sidebar-overlay { display: block; }
  html[data-sidebar="open"] .main-area { margin-left: 0; }
  html[data-sidebar="open"] .topbar { padding-left: 64px; }
  .hero-row { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .compare-grid { grid-template-columns: 1fr; }
  .rank-row { grid-template-columns: 24px 1.5fr 1fr 1fr; gap: 14px; padding: 14px 18px; }
  .rank-row > :nth-child(5),
  .rank-row > :nth-child(6),
  .rank-row > :nth-child(7),
  .rank-row > :nth-child(8) { display: none; }
  .container { padding: 20px; }
  .topbar { padding: 14px 18px 14px 64px; flex-wrap: wrap; gap: 12px; }
  .hero-value { font-size: 64px; }
  .nav-actions { flex-direction: column; align-items: stretch; gap: 12px; }
  .nav-actions .nav-btn { flex: 1; justify-content: center; }
  .brand-meta { display: none; }
  .fresh { display: none; }
}
</style>
</head>
<body>

<button class="sidebar-toggle-btn" id="sidebarToggle" title="Cmd/Ctrl + B">
  <span id="toggleArrow">›</span>
</button>

<aside class="sidebar">
  <div class="sidebar-head">
    <div class="sidebar-logo-box" id="sidebar-logo">B</div>
    <div class="sidebar-logo-text">
      <span class="title">Backoffice</span>
      <span class="sub">Vero B2C</span>
    </div>
  </div>
  <div class="sidebar-list" id="sidebarList"></div>
</aside>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="main-area">
<header class="topbar">
  <div class="brand-wrap" id="brand-name">
    <div class="brand-icon" id="brand-icon">B</div>
    <div class="brand-text">
      <span class="title" id="brand-title">Backoffice</span>
      <span class="sub" id="brand-sub">Vero B2C</span>
    </div>
  </div>
  <div class="brand-meta" id="brand-meta">JUNHO · 2026</div>
  <div class="topbar-right">
    <div class="fresh"><span class="fresh-dot"></span><span id="fresh-label">agora</span></div>
    <button class="theme-toggle" id="theme-toggle">☀</button>
  </div>
</header>

<main class="container" id="main-view"></main>

<footer class="footer">
  <div id="footer-ts">backoffice · auto · —</div>
  <div>Mídia Simples</div>
</footer>

function fmtNum(n) { return Number(n).toLocaleString('pt-BR'); }
function fmtNumDec(n, d) {
  return Number(n).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });

function fmtMoeda(n) { return 'R$ ' + Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtMoedaCompact(n) { return 'R$ ' + Math.round(Number(n)).toLocaleString('pt-BR'); }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function freshness(isoStr) {
  const then = new Date(isoStr);
  const now = new Date();
  const diffMin = Math.floor((now - then) / 60000);
  if (diffMin < 1) return 'agora';
  if (diffMin < 60) return 'há ' + diffMin + ' min';
  const h = Math.floor(diffMin / 60);
  if (h < 24) return 'há ' + h + 'h';
  return 'há ' + Math.floor(h/24) + 'd';
}

function getFuncByView(viewKey) {

function getViewName(key) {

function navBtnHtml(targetKey, direction, primary) {
  const name = getViewName(targetKey);
  const arrow = direction === 'next' ? '<span class="arrow-r">→</span>' : '<span class="arrow-l">←</span>';
  let avatar = '';
  if (targetKey !== 'consolidado') {
    const m = FUNC_META[targetKey];

  } else {
    avatar = '<span class="nav-avatar" style="background:#0EA5E9; color:#fff">B</span>';
  }
  const cls = primary ? 'nav-btn primary' : 'nav-btn';
  if (direction === 'next') {
    return '<button class="' + cls + '" data-goto="' + targetKey + '">' +
      avatar + '<span>' + escapeHtml(name) + '</span>' + arrow +
    '</button>';
  }
  return '<button class="' + cls + '" data-goto="' + targetKey + '">' +
    arrow + avatar + '<span>' + escapeHtml(name) + '</span>' +
  '</button>';
}

function navActionsHtml(currentView) {
  const idx = VIEW_ORDER.indexOf(currentView);
  const prev = idx > 0 ? VIEW_ORDER[idx - 1] : null;
  const next = idx < VIEW_ORDER.length - 1 ? VIEW_ORDER[idx + 1] : null;

  if (currentView === 'consolidado') {
    if (!next) return '';
    return '<div class="nav-actions"><div class="left-group"></div><div class="right-group">' +
      navBtnHtml(next, 'next', false) +
    '</div></div>';
  }

  let left = '<button class="nav-btn primary" data-goto="consolidado">' +
    '<span class="arrow-l">↑</span><span>Voltar ao Consolidado</span></button>';

  let right = '';
  if (prev) right += navBtnHtml(prev, 'prev', false);
  if (next) right += navBtnHtml(next, 'next', false);

  return '<div class="nav-actions">' +
    '<div class="left-group">' + left + '</div>' +
    '<div class="right-group">' + right + '</div>' +
  '</div>';
}

        '<div class="kpi-value" style="font-size:24px; margin:8px 0; color:var(--text-muted)">' + f.horas_sabado + 'h <span style="font-size:16px;">sáb</span></div>' +
      '</div>' +
    '</div>' +

    '<div class="stats-grid">' +
      '<div class="stat-card"><div class="label">Vendas no mês</div><div class="value">' + fmtNum(f.vendas_mes) + '</div><div class="footer-stat"><span class="pill brand">rank #' + f.rank_volume + '</span></div></div>' +
      '<div class="stat-card"><div class="label">Vendas/hora</div><div class="value">' + f.aproveitamento_fmt + '</div><div class="footer-stat"><span class="pill brand">rank #' + f.rank_aproveitamento + '</span></div></div>' +
      '<div class="stat-card"><div class="label">Horas trab.</div><div class="value">' + fmtNum(f.horas_trabalhadas_ate_hoje) + '<span style="font-size:18px; color:var(--text-muted)">h</span></div><div class="footer-stat"><span class="pill neutral">até ' + DATA.meta.dia_atual_fmt + '</span></div></div>' +
      '<div class="stat-card"><div class="label">Receita inc.</div><div class="value">' + fmtMoedaCompact(f.receita_mes) + '</div><div class="footer-stat"><span class="pill neutral">ticket ' + fmtMoeda(f.ticket_medio) + '</span></div></div>' +
    '</div>' +

    '<div class="card chart-card">' +
      '<div class="card-head"><span class="card-label">Vendas diárias · ' + escapeHtml(f.nome) + '</span><span class="card-meta">' + fmtNum(f.vendas_mes) + ' vendas no mês</span></div>' +
      '<div class="chart-wrap"><canvas id="chartDaily"></canvas></div>' +
    '</div>' +

    navActionsHtml(viewKey);
}

// === CHART ===
function renderChart(serie, color) {
  const ctx = document.getElementById('chartDaily');
  if (!ctx || !serie || !serie.length) return;
  if (chartDaily) chartDaily.destroy();

  const labels = serie.map(d => String(d.dia).padStart(2,'0') + '/' + String(DATA.meta.mes_numero).padStart(2,'0'));
  const values = serie.map(d => d.vendas);
  const hoje = DATA.meta.dia_atual;

  const r = parseInt(color.slice(1,3),16), g = parseInt(color.slice(3,5),16), b = parseInt(color.slice(5,7),16);
  const colors = serie.map(d => {
    const a = d.vendas === 0 ? 0.18 : (d.dia === hoje ? 0.7 : 1);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  });

  const textMuted = getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim();
  const borderCol = getComputedStyle(document.documentElement).getPropertyValue('--border').trim();
  const bgTooltip = getComputedStyle(document.documentElement).getPropertyValue('--bg-card').trim();
  const textCol = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();

  chartDaily = new Chart(ctx.getContext('2d'), {
    type: 'bar',
    data: { labels, datasets: [{ data: values, backgroundColor: colors, barPercentage: 0.7, categoryPercentage: 0.85 }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: bgTooltip, borderColor: borderCol, borderWidth: 1,
          titleColor: textCol, bodyColor: textCol,
          titleFont: { family: 'JetBrains Mono', size: 10 },
          bodyFont: { family: 'Inter', size: 12 },
          padding: 10, displayColors: false, cornerRadius: 0,
          callbacks: {
            title: (items) => items[0].label,
            label: (item) => item.parsed.y + ' venda' + (item.parsed.y === 1 ? '' : 's')
          }
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: textMuted, font: { family: 'JetBrains Mono', size: 9 }, autoSkip: true, autoSkipPadding: 10, maxRotation: 0 }},
        y: { beginAtZero: true, grid: { color: borderCol }, ticks: { color: textMuted, font: { family: 'JetBrains Mono', size: 9 }, stepSize: 1, precision: 0 }}
      }
    }
  });
}

function updateToggleArrow() {
  document.getElementById('toggleArrow').textContent = getSidebar() === 'open' ? '‹' : '›';
}

function toggleSidebar() {
  const newState = getSidebar() === 'open' ? 'closed' : 'open';
  localStorage.setItem('backoffice-sidebar', newState);
  document.documentElement.setAttribute('data-sidebar', newState);
  updateToggleArrow();
}

function render() {
  const view = getView();
  document.documentElement.setAttribute('data-view', view);
  document.documentElement.setAttribute('data-theme', getTheme());
  document.documentElement.setAttribute('data-sidebar', getSidebar());

  renderSidebar();
  renderHeader();
  updateToggleArrow();

  const main = document.getElementById('main-view');
  let serie, color;

  if (view === 'consolidado') {
    main.innerHTML = viewConsolidado();
    serie = DATA.consolidado.serie_diaria;
    color = '#0EA5E9';
  } else {
    main.innerHTML = viewFuncionaria(view);
    const f = getFuncByView(view);
    serie = f ? f.serie_diaria : [];
    color = FUNC_META[view].cor;
  }

  if (serie && serie.length && document.getElementById('chartDaily')) {
    setTimeout(() => renderChart(serie, color), 50);
  }

  document.querySelectorAll('[data-goto]').forEach(el => {
    if (el.closest('.sidebar')) return;
    el.addEventListener('click', () => {
      localStorage.setItem('backoffice-view', el.dataset.goto);
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  document.getElementById('fresh-label').textContent = freshness(DATA.meta.gerado_em);
  document.getElementById('footer-ts').textContent = 'backoffice · auto · ' + DATA.meta.gerado_em_br;
  document.getElementById('theme-toggle').textContent = getTheme() === 'dark' ? '☀' : '◐';
}

document.getElementById('theme-toggle').addEventListener('click', () => {
  localStorage.setItem('backoffice-theme', getTheme() === 'dark' ? 'light' : 'dark');
  render();
});
document.getElementById('sidebarToggle').addEventListener('click', toggleSidebar);
document.getElementById('sidebarOverlay').addEventListener('click', () => {
  if (getSidebar() === 'open') toggleSidebar();
});
document.getElementById('sidebar-logo').addEventListener('click', () => {
  localStorage.setItem('backoffice-view', 'consolidado');
  localStorage.setItem('backoffice-sidebar', 'closed');
  document.documentElement.setAttribute('data-sidebar', 'closed');
  updateToggleArrow();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
document.getElementById('brand-name').addEventListener('click', () => {
  localStorage.setItem('backoffice-view', 'consolidado');
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'b') {
    e.preventDefault();
    toggleSidebar();
  }
});

render();
</script>
</body>
</html>
